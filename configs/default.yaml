paper:
  slug: fun-selfie-filters-in-face-recognition-impact-assessment-and-removal
  title: "Fun Selfie Filters in Face Recognition: Impact Assessment and Removal"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: null
model:
  image_size: 112
  emb_dim: 128
train:
  protocol: full
  seed: 42
  num_workers: 4
  batch_size: 64
  epochs: 8
  lr: 0.05
eval:
  batch_size: 128
  max_lfw_pairs: null
  coverages: [low, medium, high]
  placements: [eyes, nose, mouth, total]
paths:
  checkpoint_dir: outputs/checkpoints/full
  log_dir: outputs/logs/full
  pred_dir: outputs/predictions/full
  figure_dir: outputs/figures/full
device: cuda
