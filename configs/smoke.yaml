paper:
  slug: fun-selfie-filters-in-face-recognition-impact-assessment-and-removal
  title: "Fun Selfie Filters in Face Recognition: Impact Assessment and Removal"
data:
  celeba_root: ../../datasets/celeba/extracted/celeba
  lfw_root: ../../datasets/lfw
  calfw_root: ../../datasets/calfw/extracted/calfw-hf
  cplfw_root: ../../datasets/cplfw/extracted/cplfw-hf
  root: ../../datasets/celeba/extracted/celeba
  train_ratio: 0.7
  max_images: 1024
model:
  image_size: 112
  emb_dim: 128
train:
  protocol: smoke
  seed: 42
  num_workers: 2
  batch_size: 32
  epochs: 1
  lr: 0.05
eval:
  batch_size: 64
  max_lfw_pairs: 200
  coverages: [low, high]
  placements: [eyes, total]
paths:
  checkpoint_dir: outputs/checkpoints/smoke
  log_dir: outputs/logs/smoke
  pred_dir: outputs/predictions/smoke
  figure_dir: outputs/figures/smoke
device: cuda
